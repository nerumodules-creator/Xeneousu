<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>Zxreiii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'Inter',sans-serif;color:#e8e8e8;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.container{width:100%;max-width:380px;text-align:center}

.avatar{width:90px;height:90px;margin:0 auto 16px;background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #2a2a2a;box-shadow:0 0 40px rgba(255,255,255,.06);font-size:42px}

.name{font-weight:800;letter-spacing:-0.5px;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.verified{color:#1da1f2;font-size:18px}

.handle{font-family:'JetBrains Mono',monospace;color:#555;font-size:13px;margin-top:4px}

.bio{color:#888;font-size:14px;margin:12px auto 24px}

.divider{max-width:360px;margin:0 auto 20px;border-top:1px solid #1a1a1a}

.social-btn{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 20px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;text-decoration:none;transition:.25s;border:1px solid transparent;width:100%;margin-bottom:10px}
.social-btn:hover{transform:scale(1.03);border-color:#444}
.social-btn i{font-size:22px}

.social-btn.youtube{background:#ff0000}
.social-btn.tiktok{background:#000;border-color:#333}

.footer{margin-top:24px;padding-top:16px}
.footer p{font-size:11px;color:#333;font-family:'JetBrains Mono',monospace}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeIn .5s ease}
</style>
</head>
<body>

<div class="container">
  <div class="avatar">👨🏿‍💻</div>

  <div class="name">
    Zxreiii
    <span class="verified"><i class="fas fa-check-circle"></i></span>
  </div>

  <div class="handle">@zxreiii</div>

  <div class="bio">💻 Developer</div>

  <div class="divider"></div>

  <a href="https://youtube.com/@zxreiii" target="_blank" class="social-btn youtube">
    <i class="fab fa-youtube"></i>
    <span>YouTube</span>
  </a>

  <a href="https://tiktok.com/@zxreiizxc" target="_blank" class="social-btn tiktok">
    <i class="fab fa-tiktok"></i>
    <span>TikTok</span>
  </a>

  <div class="footer">
    <p>Xeneosu v1.0</p>
  </div>
</div>

</body>
</html>
